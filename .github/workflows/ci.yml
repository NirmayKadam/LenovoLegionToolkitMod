name: CI

# Builds the app and the command-line tool and runs every test, on each push and pull request to main.
# No signing, no secrets, no installer: that stays on the developer's machine (make.bat).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: 9.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'

    # Per project, never the .sln: it also holds a packaging project (.wapproj) the dotnet CLI can't build.
    - name: Restore
      run: |
        dotnet restore LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj
        dotnet restore LenovoLegionToolkit.CLI/LenovoLegionToolkit.CLI.csproj
        dotnet restore LenovoLegionToolkit.Tests/LenovoLegionToolkit.Tests.csproj

    # Warnings are errors here (only here, so a new SDK warning can't stop a local build).
    - name: Build app
      run: dotnet build LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj -c Release --no-restore -warnaserror

    - name: Build command-line tool
      run: dotnet build LenovoLegionToolkit.CLI/LenovoLegionToolkit.CLI.csproj -c Release --no-restore -warnaserror

    - name: Test
      run: dotnet test LenovoLegionToolkit.Tests/LenovoLegionToolkit.Tests.csproj -c Release --no-restore -warnaserror --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory TestResults

    # Job logs need a signed-in GitHub account; annotations don't. Each failed test's name and message is shown on
    # the run's summary page.
    - name: Show failed tests
      if: failure()
      shell: pwsh
      run: |
        $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
        Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
          [xml]$trx = Get-Content $_.FullName
          Select-Xml -Xml $trx -XPath '//t:UnitTestResult[@outcome="Failed"]' -Namespace $ns | ForEach-Object {
            $result = $_.Node
            $message = "$($result.Output.ErrorInfo.Message)" -replace '\r?\n', ' '
            if ($message.Length -gt 900) { $message = $message.Substring(0, 900) }
            Write-Output "::error title=Test failed: $($result.testName)::$message"
          }
        }

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results
        path: TestResults
        if-no-files-found: ignore

name: Release

# Pushing a tag vX.Y.Z or vX.Y.Z.W on a commit of main builds, tests, signs and packages Indra, then creates a DRAFT
# GitHub release with the installer and its SHA-256. Nothing becomes public until the draft is published by hand.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions), added by the repository owner:
#   LLT_CERT_PFX       the signing certificate (.pfx), base64-encoded
#   LLT_CERT_PASSWORD  its password
# Without them the run stops before building: Windows doesn't start an unsigned app that asks for uiAccess.
# The signed files are checked against the committed LenovoLegionToolkit.cer, so a different certificate fails the run.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0

    - name: Check version and branch
      id: meta
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+(\.\d+)?)$') {
          Write-Error "Tag '$env:REF_NAME' is not vX.Y.Z or vX.Y.Z.W."
          exit 1
        }
        $version = $Matches[1]
        git merge-base --is-ancestor HEAD origin/main
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Tag '$env:REF_NAME' is not on main; releases are only made from main."
          exit 1
        }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      shell: powershell

    - name: Check signing secrets
      env:
        LLT_CERT_PFX: ${{ secrets.LLT_CERT_PFX }}
        LLT_CERT_PASSWORD: ${{ secrets.LLT_CERT_PASSWORD }}
      run: |
        if (-not $env:LLT_CERT_PFX -or -not $env:LLT_CERT_PASSWORD) {
          Write-Error "Missing LLT_CERT_PFX or LLT_CERT_PASSWORD secret; see the top of this workflow."
          exit 1
        }
      shell: powershell

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: 9.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'

    # Per project, never the .sln: it also holds a packaging project (.wapproj) the dotnet CLI can't build.
    - name: Restore
      run: |
        dotnet restore LenovoLegionToolkit.WPF/LenovoLegionToolkit.WPF.csproj
        dotnet restore LenovoLegionToolkit.CLI/LenovoLegionToolkit.CLI.csproj
        dotnet restore LenovoLegionToolkit.Tests/LenovoLegionToolkit.Tests.csproj

    - name: Test
      run: dotnet test LenovoLegionToolkit.Tests/LenovoLegionToolkit.Tests.csproj -c Release --no-restore -warnaserror

    - name: Restore signing certificate
      env:
        LLT_CERT_PFX: ${{ secrets.LLT_CERT_PFX }}
      run: '[IO.File]::WriteAllBytes("LenovoLegionToolkit.pfx", [Convert]::FromBase64String($env:LLT_CERT_PFX))'
      shell: powershell

    - name: Build, sign and package
      env:
        LLT_CERT_PASSWORD: ${{ secrets.LLT_CERT_PASSWORD }}
      run: .\make_action.bat ${{ steps.meta.outputs.version }}

    - name: Remove signing certificate
      if: always()
      run: if (Test-Path "LenovoLegionToolkit.pfx") { Remove-Item "LenovoLegionToolkit.pfx" -Force }
      shell: powershell

    # The certificate is self-signed, so on this runner the status is UnknownError (root not trusted here) rather than
    # Valid; what matters is that each file is signed, unmodified, and by the committed certificate.
    - name: Check signatures and compute SHA-256
      id: installer
      env:
        VERSION: ${{ steps.meta.outputs.version }}
      run: |
        $expected = (New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("LenovoLegionToolkit.cer")).Thumbprint
        $installers = @(Get-ChildItem "build_installer\LenovoLegionToolkitSetup-v$($env:VERSION)_Build*.exe")
        if ($installers.Count -ne 1) {
          Write-Error "Expected one installer for $env:VERSION in build_installer, found $($installers.Count)."
          exit 1
        }
        foreach ($file in @("build\Lenovo Legion Toolkit.exe", $installers[0].FullName)) {
          $sig = Get-AuthenticodeSignature $file
          if ($sig.Status -notin @('Valid', 'UnknownError') -or $sig.SignerCertificate.Thumbprint -ne $expected) {
            Write-Error "$file is not signed by LenovoLegionToolkit.cer (status $($sig.Status), signer $($sig.SignerCertificate.Thumbprint))."
            exit 1
          }
        }
        $name = "Indra-LegionToolkitMod-Setup-v$env:VERSION.exe"
        Rename-Item -Path $installers[0].FullName -NewName $name
        $hash = (Get-FileHash "build_installer\$name" -Algorithm SHA256).Hash
        "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      shell: powershell

    - name: Create draft release
      uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
      with:
        draft: true
        tag_name: ${{ github.ref_name }}
        target_commitish: main
        name: Indra – Legion Toolkit Mod v${{ steps.meta.outputs.version }}
        body: |
          Installer: `${{ steps.installer.outputs.name }}`
          SHA-256: `${{ steps.installer.outputs.sha256 }}`

          Built and tested by the release workflow from `${{ github.sha }}`. Review the notes, then publish this draft.
        files: build_installer/${{ steps.installer.outputs.name }}
        token: ${{ secrets.GITHUB_TOKEN }}

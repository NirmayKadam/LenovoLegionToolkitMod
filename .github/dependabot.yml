# Dependabot opens pull requests for outdated packages and actions. Nothing is merged automatically: each pull
# request runs CI and waits for review. Major versions are left out because they need a planned upgrade (WPF-UI 4 is
# a rewrite of the UI library; the LLT.* hardware libraries are pre-release builds tied to this app).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "LLT.*"
      # Each needs a planned change, not a version bump (tried in Round 18): 2.0 of System.CommandLine removed the API
      # the command-line tool is written against, and newer CsWin32 generates different native signatures for the
      # D3D and HID code.
      - dependency-name: "System.CommandLine"
      - dependency-name: "Microsoft.Windows.CsWin32"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
